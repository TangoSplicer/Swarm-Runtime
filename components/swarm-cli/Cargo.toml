[package]
name = "swarm-cli"
version = "1.0.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "multipart"] }
tokio = { version = "1.32", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.22"
ed25519-dalek = "2.2"
synapse = { version = "1.0.0", path = "../synapse" }
uuid = { version = "1.0", features = ["v4"] }
