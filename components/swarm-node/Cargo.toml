[package]
name = "swarm-node"
version = "1.0.0"
edition = "2021"

[dependencies]
# Core Logic
tokio = { version = "1.28", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.4", features = ["v4", "serde"] }
dashmap = "5.5"
base64 = "0.21"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.3", features = ["derive"] }
sled = "0.34"

# Networking (Must match Synapse version)
libp2p = { version = "0.56", default-features = false, features = ["gossipsub", "macros", "tokio", "tcp", "noise", "yamux", "kad", "identify", "request-response", "cbor"] }

# Web Server
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "macros", "multipart", "tokio"] }

# Internal Components
synapse = { version = "1.0.0", path = "../synapse" }
judge = { version = "1.0.0", path = "../judge" }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
sysinfo = "0.38.2"
sha2 = "0.10.9"
hex = "0.4"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "multipart"] }
rand = "0.8.5"
lazarus = { version = "1.0.0", path = "../lazarus" }
