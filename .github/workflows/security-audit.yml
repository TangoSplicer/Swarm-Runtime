name: Dependency security audit

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and advisory database
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-audit-${{ runner.os }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Enforce restricted Libp2p feature policy
        run: |
          ! grep -RE 'features = .*"(mdns|tls|quic|websocket)"' \
            components/swarm-node/Cargo.toml components/synapse/Cargo.toml

      - name: Scan locked dependencies for RustSec advisories
        # The two exceptions are inactive optional mDNS dependencies, documented with
        # exploit conditions and a review deadline in SECURITY_OPERATIONS.md.
        run: >-
          cargo audit --file Cargo.lock
          --ignore RUSTSEC-2026-0118
          --ignore RUSTSEC-2026-0119
