name: Coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Generate code coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-${{ runner.os }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate LCOV and HTML coverage reports
        run: |
          cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info
          cargo llvm-cov --workspace --all-targets --html --output-dir coverage-html

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ github.sha }}
          path: |
            lcov.info
            coverage-html/
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
